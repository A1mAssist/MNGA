name: Build private no-IAP MNGA IPA

on:
  workflow_dispatch:

jobs:
  build:
    name: Build private unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26"

      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust target
        run: rustup target add aarch64-apple-ios

      - name: Install prerequisites
        run: |
          brew install swift-protobuf
          brew tap tuist/tuist
          brew install --formula tuist@4.131.1

      - name: Build Rust logic framework
        run: make logic-deploy

      - name: Generate Xcode project
        run: tuist generate
        working-directory: app

      - name: Build unsigned private app bundle
        run: |
          set -euo pipefail
          xcodebuild \
            -project app/MNGA.xcodeproj \
            -scheme MNGA \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -type d -name '*.app' | head -n 1)"
          test -n "$APP_PATH"
          rm -rf build/unsigned build/MNGA-private-no-iap-unsigned.ipa
          mkdir -p build/unsigned/Payload
          ditto "$APP_PATH" "build/unsigned/Payload/$(basename "$APP_PATH")"
          (cd build/unsigned && /usr/bin/zip -qry ../MNGA-private-no-iap-unsigned.ipa Payload)
          ls -lh build/MNGA-private-no-iap-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MNGA-private-no-iap-unsigned-ipa
          path: build/MNGA-private-no-iap-unsigned.ipa
          if-no-files-found: error
